name: Email Alert for Issues and Pull Requests

on:
  schedule:
    - cron: "*/15 * * * *"   # runs every 15 minutes
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Check new Issues and Pull Requests
        uses: actions/github-script@v7
        with:
          script: |
            const owner = "ohcnetwork";
            const repo = "care_fe";

            // Fetch latest open issues & PRs
            const response = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              sort: "created",
              direction: "desc",
              per_page: 1
            });

            const item = response.data[0];

            if (item && !item.assignee) {
              const type = item.pull_request ? "Pull Request" : "Issue";

              core.exportVariable("SEND_EMAIL", "true");
              core.exportVariable("ITEM_TYPE", type);
              core.exportVariable("ITEM_TITLE", item.title);
              core.exportVariable("ITEM_URL", item.html_url);
            } else {
              core.exportVariable("SEND_EMAIL", "false");
            }

      - name: Send Email Notification
        if: env.SEND_EMAIL == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "🚨 New ${{ env.ITEM_TYPE }} in care_fe"
          body: |
            A new unassigned ${{ env.ITEM_TYPE }} has been created in the repository.

            Title: ${{ env.ITEM_TITLE }}
            Link: ${{ env.ITEM_URL }}

            Repository: ohcnetwork/care_fe
          to: aravindswamymajjuri143@gmail.com, kadaripavani1@gmail.com
          from: GitHub Notification Bot <aravindswamymajjuri143@gmail.com>
