name: Email Alert for New Issues

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Check new issues in original repo
        uses: actions/github-script@v7
        with:
          script: |
            const owner = "ohcnetwork";
            const repo = "care_fe";

            const issues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              sort: "created",
              direction: "desc",
              per_page: 1
            });

            const issue = issues.data[0];

            if (issue && !issue.assignee) {
              core.setOutput("title", issue.title);
              core.setOutput("url", issue.html_url);
            }

      - name: Send Email
        if: steps.notify.outputs.url != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "🚨 New Issue in care_fe"
          body: |
            A new unassigned issue has been created.

            Title: ${{ steps.notify.outputs.title }}
            Link: ${{ steps.notify.outputs.url }}
          to: your_email@gmail.com
          from: GitHub Issue Bot <your_email@gmail.com>
          
